<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VyOS VPN Tools</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=VT323&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <header class="app-header">
    <div class="logo">
      <img src="/static/favicon.png" alt="VyOS Logo" width="32" height="32">
      VyOS VPN Tools
    </div>

    <div class="header-controls">
      <select id="themeSelect" aria-label="Seleccionar Tema">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="retro">Retro</option>
      </select>
    </div>

    <div class="header-center">
      <button id="fetchBtn" class="primary connect-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5rem">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Pulse para conectar a VyOS
      </button>
    </div>
  </header>

  <main class="main-container">
    <div id="content"></div>
  </main>

  <script src="/static/app.js"></script>
</body>

</html>
